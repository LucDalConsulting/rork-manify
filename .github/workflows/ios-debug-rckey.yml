name: Debug RC Key Injection

# One-off diagnostic: confirms whether the RevenueCat secret reaches the build
# and whether it lands in the generated Info.plist (RCAPIKey). No signing.
# Prints only LENGTHS, never the key value.

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Report secret presence
        env:
          REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_API_KEY }}
        run: |
          echo "secret_len=${#REVENUECAT_IOS_API_KEY}"
          echo "secret_prefix=$(printf '%s' "$REVENUECAT_IOS_API_KEY" | cut -c1-5)"

      - name: Build (Release, simulator, no signing) with direct Info.plist injection
        working-directory: ios
        env:
          REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_API_KEY }}
        run: |
          xcodebuild build \
            -project Manify.xcodeproj \
            -scheme Manify \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_dd \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_RCAPIKey="$REVENUECAT_IOS_API_KEY" \
            INFOPLIST_KEY_RCTestAPIKey="$REVENUECAT_IOS_API_KEY"

      - name: Inspect built Info.plist
        working-directory: ios
        run: |
          APP=$(find build_dd/Build/Products -name "Manify.app" -maxdepth 3 | head -1)
          echo "app=$APP"
          PLIST="$APP/Info.plist"
          RCAPI=$(plutil -extract RCAPIKey raw -o - "$PLIST" 2>/dev/null || echo "")
          RCTEST=$(plutil -extract RCTestAPIKey raw -o - "$PLIST" 2>/dev/null || echo "")
          echo "RCAPIKey_len=${#RCAPI}"
          echo "RCTestAPIKey_len=${#RCTEST}"
          echo "--- all RC* keys present in Info.plist ---"
          plutil -p "$PLIST" | grep -i "RC" || echo "(no RC keys found)"
