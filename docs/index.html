<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manify</title>
  <style>
    :root { --bg:#0c0e12; --gold:#d4af37; --text:#ececf0; --muted:#9aa0aa; }
    body { margin:0; background:var(--bg); color:var(--text); min-height:100vh;
      display:flex; align-items:center; justify-content:center; text-align:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .wrap { padding:40px 22px; max-width:520px; }
    h1 { color:var(--gold); font-size:40px; margin:0 0 6px; letter-spacing:1px; }
    p { color:var(--muted); font-size:17px; margin:0 0 28px; }
    .links a { display:inline-block; margin:8px; padding:12px 22px; border-radius:12px;
      background:var(--gold); color:#0c0e12; text-decoration:none; font-weight:700; }
    .links a.ghost { background:transparent; color:var(--gold);
      border:1px solid rgba(212,175,55,.4); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>MANIFY</h1>
    <p>Become a Real Man — one skill at a time.</p>
    <div class="links">
      <a href="support.html">Support</a>
      <a class="ghost" href="privacy.html">Privacy Policy</a>
    </div>
  </div>
</body>
</html>
